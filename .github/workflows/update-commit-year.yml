name: Update commit-year graphic

on:
  schedule:
    - cron: "17 15 * * *"      # 매일 00:17 KST (UTC 15:17)
  workflow_dispatch:           # Actions 탭에서 수동 실행 가능
  push:
    paths:
      - "scripts/commit_year.py"
      - ".github/workflows/update-commit-year.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate graphic
        run: python scripts/commit_year.py
        env:
          GITHUB_USER: ${{ github.repository_owner }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/commit-year.svg assets/commit-year-static.svg
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: update commit-year graphic"
            git push
          fi
