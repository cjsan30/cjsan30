name: Update recent posts

on:
  schedule:
    - cron: "47 15 * * *"      # 매일 00:47 KST (commit-year 워크플로와 시간대 분리)
  workflow_dispatch:
  push:
    paths:
      - "scripts/update_posts.py"
      - ".github/workflows/update-posts.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python scripts/update_posts.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: update recent posts"
            git pull --rebase
            git push
          fi
